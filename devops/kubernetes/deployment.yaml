# Templates only: images, probes, resources, and secret references need
# validation against implemented apps and the chosen Kubernetes provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxinov-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: oxinov-frontend }
  template:
    metadata:
      labels: { app: oxinov-frontend }
    spec:
      containers:
        - name: frontend
          image: registry.example.invalid/oxinov/frontend:replace-me
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: oxinov-config } }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxinov-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: oxinov-backend }
  template:
    metadata:
      labels: { app: oxinov-backend }
    spec:
      containers:
        - name: backend
          image: registry.example.invalid/oxinov/backend:replace-me
          ports: [{ containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: oxinov-config } }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: oxinov-runtime, key: database-url }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
