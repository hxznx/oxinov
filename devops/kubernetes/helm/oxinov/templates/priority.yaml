{{- /* Scheduling priority on the shared node (ADR-022). Created as an early hook so the pre-upgrade
       migration Job can already use them; before-hook-creation keeps them in step with the values. */ -}}
{{- if .Values.priorityClasses.enabled }}
{{- range $tier, $cls := .Values.priorityClasses.tiers }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ printf "oxinov-%s" $tier }}
  labels:
    {{- include "oxinov.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
value: {{ $cls.value }}
globalDefault: false
preemptionPolicy: {{ $cls.preemption | default "PreemptLowerPriority" }}
description: {{ $cls.description | quote }}
{{- end }}
{{- end }}
