# Oxinov sign-in pages for the `oxinov` customer realm (id.oxinov.com). Brand system: docs/07-design/brand.md.
# Built on the unstyled `base` theme so no PatternFly or third-party styles load. Class names below are
# Oxinov's own; resources/css/oxinov.css styles them with the design tokens (resources/css/tokens.css is an
# exact copy of packages/design-system/dist/tokens.css, checked by scripts/validate_project.py).
parent=base
locales=en
styles=css/tokens.css css/oxinov.css
stylesCommon=
# Space-separated name==content pairs (no spaces inside a value). tokens.css sets color-scheme itself.
meta=viewport==width=device-width,initial-scale=1 robots==noindex,nofollow

kcHtmlClass=ox-html
kcBodyClass=ox-body
kcLoginClass=ox-page
kcHeaderClass=ox-brand
kcHeaderWrapperClass=ox-brand-name
kcFormCardClass=ox-card
kcFormHeaderClass=ox-card-header
kcContentWrapperClass=ox-row
kcFeedbackAreaClass=
kcLocaleClass=

kcAlertClass=ox-alert
kcAlertTitleClass=ox-alert-text

kcFormAreaClass=
kcFormClass=ox-form
kcFormGroupClass=ox-field
kcFormGroupErrorClass=ox-field-error
kcFormGroupHeader=ox-field
kcLabelClass=ox-label
kcLabelWrapperClass=ox-label-row
kcInputClass=ox-input
kcInputWrapperClass=ox-input-row
kcInputGroup=ox-input-group
kcInputErrorMessageClass=ox-error
kcInputHelperTextBeforeClass=ox-help
kcInputHelperTextAfterClass=ox-help
kcInputClassCheckbox=ox-check
kcInputClassCheckboxInput=ox-check-input
kcInputClassCheckboxLabel=ox-check-label
kcInputClassRadio=ox-check
kcInputClassRadioInput=ox-check-input
kcInputClassRadioLabel=ox-check-label
kcCheckClass=ox-check
kcCheckInputClass=ox-check-input
kcCheckLabelClass=ox-check-label
kcTextareaClass=ox-input
kcFormOptionsClass=ox-options
kcFormOptionsWrapperClass=ox-options
kcFormButtonsClass=ox-actions
kcFormButtonsWrapperClass=ox-actions
kcFormSettingClass=ox-options
kcSignUpClass=ox-after
kcInfoAreaWrapperClass=ox-after-inner

kcButtonClass=ox-btn
