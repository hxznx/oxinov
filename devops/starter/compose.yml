# Oxinov starter server (ADR-017): every service on one Amazon Linux host, deployed by deploy.sh.
# Values come from /opt/oxinov/.env, which deploy.sh renders from Parameter Store; it is never committed.
# Only Caddy publishes ports. APIs, PostgreSQL, and the mail relay are reachable on private networks only.
name: oxinov

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    logging: *logging
    shm_size: 128m
    environment:
      POSTGRES_DB: oxinov_lms
      POSTGRES_USER: oxinov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxinov -d oxinov_lms"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m
    networks: [data]

  migrate:
    image: ${REGISTRY:?}/oxinov/migrate:${IMAGE_TAG:?}
    profiles: [tools]
    logging: *logging
    environment:
      EDU_MIGRATION_DATABASE_URL: postgresql://oxinov:${POSTGRES_PASSWORD}@postgres:5432/oxinov_lms
      PLATFORM_MIGRATION_DATABASE_URL: postgresql://oxinov:${POSTGRES_PASSWORD}@postgres:5432/oxinov_platform
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  keycloak:
    <<: *app
    image: ${REGISTRY}/oxinov/keycloak:${IMAGE_TAG}
    # Keycloak writes its compiled theme cache under /opt/keycloak/data.
    read_only: false
    command: ["start", "--optimized"]
    # Loopback only, for administration through a Session Manager port forward; never public.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: https://id.oxinov.com
      # The admin console is reached only through the loopback port forward.
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=65
    healthcheck:
      # Only an HTTP 200 means ready; the body lists sub-checks that say UP even while Keycloak is DOWN.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1100m
    networks: [data, edge, outbound]

  mail-relay:
    <<: *app
    image: ${REGISTRY}/oxinov/mail-relay:${IMAGE_TAG}
    environment:
      MAIL_FROM: no-reply@oxinov.com
      AWS_REGION: ap-south-1
    mem_limit: 128m
    networks: [outbound]

  edu-api:
    <<: *app
    image: ${REGISTRY}/oxinov/lms-api:${IMAGE_TAG}
    environment: &api-env
      NODE_ENV: production
      DEPLOY_ENVIRONMENT: production
      PORT: "4000"
      SERVICE_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://oxinov_app:${APP_DB_PASSWORD}@postgres:5432/oxinov_lms
      AUTH_ISSUER: https://id.oxinov.com/realms/oxinov
      # Keys are fetched inside the private network; the issuer claim still names the public address.
      AUTH_JWKS_URL: http://keycloak:8080/realms/oxinov/protocol/openid-connect/certs
      AUTH_AUDIENCE: oxinov-lms-api
      MEDIA_BUCKET: ${MEDIA_BUCKET:?}
      MEDIA_S3_REGION: ap-south-1
      AWS_REGION: ap-south-1
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 320m
    # outbound: upload checks read the stored object from Amazon S3.
    networks: [data, apps, outbound]

  platform-api:
    <<: *app
    image: ${REGISTRY}/oxinov/platform-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      DEPLOY_ENVIRONMENT: production
      PORT: "4200"
      SERVICE_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://oxinov_platform_app:${PLATFORM_APP_DB_PASSWORD}@postgres:5432/oxinov_platform
      AUTH_ISSUER: https://id.oxinov.com/realms/oxinov
      AUTH_JWKS_URL: http://keycloak:8080/realms/oxinov/protocol/openid-connect/certs
      AUTH_AUDIENCE: oxinov-platform-api
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    networks: [data, apps]

  edu-web:
    <<: *app
    image: ${REGISTRY}/oxinov/edu-web:${IMAGE_TAG}
    # Next.js keeps its image and fetch cache under .next/cache.
    tmpfs: [/tmp, /app/frontend/products/lms-web/.next/cache]
    environment:
      APP_URL: https://edu.oxinov.com
      ACCOUNT_URL: https://app.oxinov.com
      OIDC_ISSUER: https://id.oxinov.com/realms/oxinov
      OIDC_CLIENT_ID: oxinov-edu-web
      OIDC_CLIENT_SECRET: ${EDU_OIDC_CLIENT_SECRET:?}
      SESSION_SECRET: ${EDU_SESSION_SECRET:?}
      EDU_API_URL: http://edu-api:4000
    depends_on: [edu-api]
    mem_limit: 320m
    networks: [apps, edge]

  platform-web:
    <<: *app
    image: ${REGISTRY}/oxinov/platform-web:${IMAGE_TAG}
    tmpfs: [/tmp, /app/frontend/platform-web/.next/cache]
    environment:
      APP_URL: https://app.oxinov.com
      OIDC_ISSUER: https://id.oxinov.com/realms/oxinov
      OIDC_CLIENT_ID: oxinov-platform-web
      OIDC_CLIENT_SECRET: ${PLATFORM_OIDC_CLIENT_SECRET:?}
      SESSION_SECRET: ${PLATFORM_SESSION_SECRET:?}
      PLATFORM_API_URL: http://platform-api:4200
    depends_on: [platform-api]
    mem_limit: 320m
    networks: [apps, edge]

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Public-facing: Caddy and the services it proxies to.
  edge:
  # Web apps to their APIs.
  apps:
    internal: true
  # Databases: no route to the internet.
  data:
    internal: true
  # Services that call AWS or other internet endpoints: Keycloak to the mail relay, the relay to
  # Amazon SES, and the Edu API to Amazon S3.
  outbound:
