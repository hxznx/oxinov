packages:
  - frontend/*
  - frontend/products/*
  - frontend/mobile/*
  - backend/*
  - backend/products/*
  - backend/workers/*
  - packages/*

catalogMode: strict

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - turbo

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true

catalog:
  '@aws-sdk/client-s3': 3.1139.0
  '@aws-sdk/s3-request-presigner': 3.1139.0
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
