name: ${COMPOSE_PROJECT_NAME:-oxinov-lms}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oxinov_lms}
      POSTGRES_USER: ${POSTGRES_USER:-oxinov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      # Password for the least-privilege API role, created on first volume initialisation.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Password for the platform API request role; the platform database is created on first initialisation.
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/products/edu/policies/local-app-role.sh:/docker-entrypoint-initdb.d/10-local-app-role.sh:ro
      - ./database/platform/policies/local-app-role.sh:/docker-entrypoint-initdb.d/20-platform-app-role.sh:ro
      - ./devops/keycloak/init-db.sh:/docker-entrypoint-initdb.d/30-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  # S3-compatible object storage for local development (lesson media). Production uses Amazon S3.
  # SeaweedFS replaces MinIO, whose images are no longer published. The access key pair is written to a
  # config file inside the container at start-up, so no credential is stored in the repository.
  object-storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"oxinov-local","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:8333"
    volumes:
      - object_storage_data:/data
    networks: [private]

  backend:
    profiles: [app]
    build: { context: ., dockerfile: devops/docker/Dockerfile, target: backend }
    environment:
      NODE_ENV: development
      DEPLOY_ENVIRONMENT: local
      PORT: 4000
      # The API connects as oxinov_app, which cannot bypass row-level security.
      DATABASE_URL: postgresql://oxinov_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxinov_lms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_DEV_JWT_SECRET: ${AUTH_DEV_JWT_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]

  frontend:
    profiles: [app]
    build: { context: ., dockerfile: devops/docker/Dockerfile, target: frontend }
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    networks: [private]

  worker:
    profiles: [app]
    build: { context: ., dockerfile: devops/docker/Dockerfile, target: worker }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxinov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxinov_lms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]

  chat:
    profiles: [app]
    build: { context: ., dockerfile: devops/docker/Dockerfile, target: chat }
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxinov}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxinov_lms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:${CHAT_PORT:-4001}:4001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]

  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-oxinov_lms}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-oxinov}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]

  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:v1.89.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    networks: [private]

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [private]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - postgres-exporter
      - redis-exporter
    networks: [private]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [private]

  # Identity (id.oxinov.com) for local development: `docker compose --profile identity up -d --wait`,
  # then `bash devops/keycloak/configure-realm.sh`. ADR-011, ADR-016.
  keycloak:
    profiles: [identity]
    build:
      context: devops/keycloak
    image: oxinov/keycloak:local
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # The supported identity launcher validates and supplies these from devops/keycloak/admin/.env.
      # Empty defaults keep unrelated Compose profiles usable without administrator credentials.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      # Sign-in event counters for the local Prometheus (same as production; see monitoring/prometheus).
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: "realm,clientId"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    # The Oxinov theme is mounted so edits show on the next page load (start-dev turns theme caching off).
    volumes:
      - ./devops/keycloak/themes/oxinov:/opt/keycloak/themes/oxinov:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [private]

  # Catches every email locally (sign-in codes, confirmations). Web UI on http://localhost:8025.
  mailpit:
    profiles: [identity]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
  object_storage_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
