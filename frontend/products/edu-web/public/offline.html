<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070D" />
    <title>You are offline · Oxinov Edu</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #07070d;
        color: #e6f1ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }
      main { max-width: 26rem; display: grid; gap: 16px; text-align: center; justify-items: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; color: #8b9bb4; }
      .label { font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 0.75rem; letter-spacing: 0.12em; color: #00f0ff; }
      button {
        min-height: 44px;
        padding: 10px 22px;
        border: 0;
        background: #00f0ff;
        color: #07070d;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      }
      button:focus-visible { outline: 2px solid #e6f1ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <span class="label">// NO CONNECTION</span>
      <h1>You are offline</h1>
      <p>Oxinov Edu needs an internet connection to show lessons, live classes, and your account. Check your Wi-Fi or mobile data, then try again.</p>
      <p>Your progress and notes are saved on Oxinov, not on this phone, so nothing is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
