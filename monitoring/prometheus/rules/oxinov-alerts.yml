groups:
  - name: oxinov-infrastructure
    rules:
      - alert: OxinovScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than two minutes."

      - alert: OxinovPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL monitoring is unavailable
          description: The PostgreSQL exporter has been unreachable for more than one minute.

      - alert: OxinovRedisExporterDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis monitoring is unavailable
          description: The Redis exporter has been unreachable for more than five minutes.

  - name: oxinov-application
    rules:
      - alert: OxinovApiHighErrorRate
        expr: |
          sum(rate(oxinov_http_requests_total{service="api",status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(oxinov_http_requests_total{service="api"}[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API server error rate exceeds 5%
          description: The API error ratio has exceeded 5% for ten minutes.

      - alert: OxinovApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(oxinov_http_request_duration_seconds_bucket{service="api"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds one second
          description: API p95 request duration has exceeded the proposed NFR target for ten minutes.

      - alert: OxinovPaymentFulfillmentFailure
        expr: increase(oxinov_payment_fulfillment_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A payment fulfillment failed
          description: At least one verified payment event failed to create its intended entitlement.

      - alert: OxinovExamSubmissionFailure
        expr: increase(oxinov_exam_submission_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: An exam submission failed
          description: At least one exam submission failed during the last ten minutes.

  # Sign-in at id.oxinov.com (keycloak_user_events_total; FR-ID-2202, FR-ID-2208, threat model). Counts carry only
  # the event, the error, and the client: never an email address or a code. Thresholds suit today's traffic;
  # review them when real sign-ins arrive. Runbook: security/soc/runbooks/SIGN-IN-ABUSE.md.
  - name: oxinov-identity
    rules:
      - alert: OxinovSignInWrongCodeSpike
        expr: sum(increase(keycloak_user_events_total{realm="oxinov",event="login",error="invalid_user_credentials"}[15m])) > 30
        labels:
          severity: warning
        annotations:
          summary: Many wrong sign-in codes
          description: More than 30 wrong six-digit codes were entered in 15 minutes, which can mean someone is guessing codes. Brute-force lockout protects each account.

      - alert: OxinovSignInUnknownEmailSpike
        expr: sum(increase(keycloak_user_events_total{realm="oxinov",event="login",error="user_not_found"}[15m])) > 100
        labels:
          severity: warning
        annotations:
          summary: Many sign-ins with unknown emails
          description: More than 100 sign-in attempts used emails with no account in 15 minutes, which can mean someone is testing which emails have Oxinov accounts.

      - alert: OxinovSignInLockouts
        expr: sum(increase(keycloak_user_events_total{realm="oxinov",error=~"user_temporarily_disabled|user_disabled"}[15m])) > 5
        labels:
          severity: warning
        annotations:
          summary: Accounts are being locked
          description: More than 5 sign-ins were refused because accounts were locked or disabled in 15 minutes.

      - alert: OxinovSignInEmailFailing
        expr: sum(increase(keycloak_user_events_total{realm="oxinov",error="email_send_failed"}[15m])) > 3
        labels:
          severity: critical
        annotations:
          summary: Sign-in emails are not being sent
          description: Keycloak could not send sign-in codes or confirmation links more than 3 times in 15 minutes. People cannot sign in. Check the mail relay logs (mail.failed, mail.limited) and SES.

      - alert: OxinovSignInMostlyFailing
        expr: |
          sum(increase(keycloak_user_events_total{realm="oxinov",event="login",error!=""}[30m]))
          /
          clamp_min(sum(increase(keycloak_user_events_total{realm="oxinov",event="login"}[30m])), 1)
          > 0.5
          and sum(increase(keycloak_user_events_total{realm="oxinov",event="login"}[30m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Most sign-ins are failing
          description: More than half of at least 20 sign-in attempts failed in the last 30 minutes.
