name: Security baseline

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  scaffold-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check scaffold security rules
        run: python scripts/validate_project.py --security

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan vulnerabilities, secrets, and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # The CI workflow builds and scans the LMS API image. CodeQL, pull-request
  # dependency review, and SBOM/provenance remain release-gate work.
