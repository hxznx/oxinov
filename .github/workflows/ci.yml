name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate project documents and local links
        run: python scripts/validate_project.py
      - name: Validate monorepo boundaries and release gates
        run: node scripts/validate-workspace.mjs
      - name: Validate Docker Compose syntax
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          APP_DB_PASSWORD: ci-only-placeholder
          PLATFORM_APP_DB_PASSWORD: ci-only-placeholder
          KEYCLOAK_DB_PASSWORD: ci-only-placeholder
          KEYCLOAK_ADMIN_USER: ci-only-placeholder
          KEYCLOAK_ADMIN_PASSWORD: ci-only-placeholder
          REDIS_PASSWORD: ci-only-placeholder
          OBJECT_STORAGE_ACCESS_KEY: ci-only-placeholder
          OBJECT_STORAGE_SECRET_KEY: ci-only-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/platform-overview.json > /dev/null
      - name: Validate Prometheus configuration and rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.14.0
          check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm
          --entrypoint /bin/amtool
          -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.34.1
          check-config /etc/alertmanager/alertmanager.yml

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: oxinov_lms_test
          POSTGRES_USER: oxinov
          POSTGRES_PASSWORD: ci-only-owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oxinov -d oxinov_lms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://oxinov:ci-only-owner@localhost:5432/oxinov_lms_test
      DATABASE_URL: postgresql://oxinov_app:ci-only-app@localhost:5432/oxinov_lms_test
      TEST_MIGRATION_DATABASE_URL: postgresql://oxinov:ci-only-owner@localhost:5432/oxinov_lms_test
      TEST_DATABASE_URL: postgresql://oxinov_app:ci-only-app@localhost:5432/oxinov_lms_test
      # Lesson media tests run against SeaweedFS, the same S3-compatible server as local development.
      TEST_MEDIA_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_MEDIA_ACCESS_KEY: ci-only-storage-key
      TEST_MEDIA_SECRET_KEY: ci-only-storage-secret-000000000000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test and build the shared server kit
        run: |
          pnpm --filter @oxinov/server-kit test
          pnpm --filter @oxinov/server-kit build
      - run: pnpm --filter @oxinov/lms-api prisma:generate
      - run: pnpm --filter @oxinov/lms-api typecheck
      - run: pnpm --filter @oxinov/lms-api lint
      - run: pnpm --filter @oxinov/lms-api test
      - name: Apply migrations with Prisma and check the schema has not drifted
        run: |
          pnpm --filter @oxinov/lms-api exec prisma migrate deploy
          pnpm --filter @oxinov/lms-api exec prisma migrate diff --from-config-datasource --to-schema ../../database/prisma/schema.prisma --exit-code
      - name: Give the request role a login for tests
        run: psql "$MIGRATION_DATABASE_URL" -c "ALTER ROLE oxinov_app LOGIN PASSWORD 'ci-only-app'"
      - run: pnpm --filter @oxinov/lms-api db:seed
      - run: pnpm --filter @oxinov/lms-api db:test-policies
      - name: Start S3-compatible storage for media tests
        run: |
          docker run -d --name object-storage -p 127.0.0.1:9000:8333 --entrypoint /bin/sh             chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 -c             "printf '{\"identities\":[{\"name\":\"ci\",\"credentials\":[{\"accessKey\":\"$TEST_MEDIA_ACCESS_KEY\",\"secretKey\":\"$TEST_MEDIA_SECRET_KEY\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\"]}]}' > /tmp/s3.json && exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json"
          for i in $(seq 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != "000" ] && exit 0; sleep 2; done
          docker logs object-storage; exit 1
      - run: pnpm --filter @oxinov/lms-api test:integration
      - run: pnpm --filter @oxinov/lms-api build

  platform-api:
    # Platform control plane (api.oxinov.com): accounts, policies, entitlements with PostgreSQL RLS.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: oxinov_platform_test
          POSTGRES_USER: oxinov
          POSTGRES_PASSWORD: ci-only-owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oxinov -d oxinov_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://oxinov:ci-only-owner@localhost:5432/oxinov_platform_test
      DATABASE_URL: postgresql://oxinov_platform_app:ci-only-app@localhost:5432/oxinov_platform_test
      TEST_MIGRATION_DATABASE_URL: postgresql://oxinov:ci-only-owner@localhost:5432/oxinov_platform_test
      TEST_DATABASE_URL: postgresql://oxinov_platform_app:ci-only-app@localhost:5432/oxinov_platform_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oxinov/server-kit build
      - run: pnpm --filter @oxinov/platform-api prisma:generate
      - run: pnpm --filter @oxinov/platform-api typecheck
      - run: pnpm --filter @oxinov/platform-api lint
      - name: Apply migrations with Prisma and check the schema has not drifted
        run: |
          pnpm --filter @oxinov/platform-api exec prisma migrate deploy
          pnpm --filter @oxinov/platform-api exec prisma migrate diff --from-config-datasource --to-schema ../../database/platform/prisma/schema.prisma --exit-code
      - name: Give the request role a login for tests
        run: psql "$MIGRATION_DATABASE_URL" -c "ALTER ROLE oxinov_platform_app LOGIN PASSWORD 'ci-only-app'"
      - run: pnpm --filter @oxinov/platform-api db:seed
      - run: pnpm --filter @oxinov/platform-api db:test-policies
      - run: pnpm --filter @oxinov/platform-api test:integration
      - run: pnpm --filter @oxinov/platform-api build

  platform-web:
    # Account portal (app.oxinov.com) and the shared @oxinov/web-auth sign-in package it uses:
    # sealed-session, PKCE, redirect-safety and configuration unit tests, type checks, build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oxinov/design-system build
      - run: pnpm --filter @oxinov/web-auth test
      - run: pnpm --filter @oxinov/web-auth typecheck
      - run: pnpm --filter @oxinov/platform-web test
      - run: pnpm --filter @oxinov/platform-web typecheck
      - name: Build (runtime settings are read at request time, not baked in)
        env:
          APP_URL: http://localhost:3001
          OIDC_ISSUER: http://localhost:8080/realms/oxinov
          OIDC_CLIENT_ID: oxinov-platform-web
          OIDC_CLIENT_SECRET: ci-only-placeholder
          PLATFORM_API_URL: http://localhost:4200
          SESSION_SECRET: ci-only-placeholder-session-secret-0000
        run: pnpm --filter @oxinov/platform-web build

  lms-web:
    # Oxinov Edu web app (edu.oxinov.com): helper unit tests, type check, build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oxinov/design-system build
      - run: pnpm --filter @oxinov/lms-web test
      - run: pnpm --filter @oxinov/lms-web typecheck
      - run: pnpm --filter @oxinov/lms-web build

  company-web:
    # oxinov.com static export: design tokens with contrast tests, site build, and page checks (FR-SITE-2101/2102/2105).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oxinov/design-system test
      - run: pnpm --filter @oxinov/design-system build
      - run: pnpm --filter @oxinov/company-web typecheck
      - run: pnpm --filter @oxinov/company-web build
      - run: pnpm --filter @oxinov/company-web test

  terraform:
    # Infrastructure code: formatting, validation without cloud access, and the CloudFront router tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: terraform fmt -recursive -check devops/terraform
      - name: Validate every stack
        run: |
          for stack in devops/terraform/bootstrap devops/terraform/environments/production/edge devops/terraform/environments/production/starter; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
      - run: node --test devops/terraform/environments/production/edge/site-router.test.mjs

  starter:
    # Starter server files (ADR-017): Compose file, shell scripts, and the SMTP-to-SES relay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @oxinov/mail-relay
      - run: pnpm --filter @oxinov/mail-relay test
      - name: Check the scripts and the Compose file
        run: |
          bash -n devops/starter/deploy.sh devops/starter/backup.sh devops/starter/postgres-init.sh devops/keycloak/configure-realm.sh
          # Placeholder values only: Compose must accept the file as the deploy script renders it.
          cat > devops/starter/.env <<'EOF'
          IMAGE_TAG=ci
          REGISTRY=registry.example
          MEDIA_BUCKET=media
          KEYCLOAK_ADMIN_USER=admin
          POSTGRES_PASSWORD=x
          APP_DB_PASSWORD=x
          PLATFORM_APP_DB_PASSWORD=x
          KEYCLOAK_DB_PASSWORD=x
          KEYCLOAK_ADMIN_PASSWORD=x
          EDU_SESSION_SECRET=x
          PLATFORM_SESSION_SECRET=x
          EDU_OIDC_CLIENT_SECRET=x
          PLATFORM_OIDC_CLIENT_SECRET=x
          EOF
          docker compose -f devops/starter/compose.yml --profile tools config --quiet
          rm devops/starter/.env

  lms-api-image:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build immutable LMS API candidate
        run: docker build --file devops/docker/Dockerfile --target backend --tag oxinov/lms-api:${{ github.sha }} .
      - name: Scan the LMS API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oxinov/lms-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # Frontend, worker, chat, and mobile tests are added when that source
  # is implemented. See docs/devops/CI-CD.md.
