global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: oxinov

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  # Keycloak's management port (KC_METRICS_ENABLED, KC_EVENT_METRICS_USER_ENABLED): sign-in event counters for
  # the oxinov-identity alerts. Runs with the Compose `identity` profile; without it this target shows as down.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]

# Add backend:4000, worker:9464, chat:4001, and frontend:3000 only after
# those applications expose /metrics. Until then, failed app targets would
# create misleading local alerts.
