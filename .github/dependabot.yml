# Automated dependency updates (ADR-018 delivery automation). Weekly, grouped, and small: every update
# arrives as a pull request that must pass CI; merged updates deploy automatically like any other change.
# Security updates are opened as soon as an advisory appears (repository setting), not on this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (Prisma, Next.js, NestJS, React) need a planned upgrade, not a bot pull request.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kathmandu
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Base images pinned by digest in the Dockerfiles (Node.js, PostgreSQL, Keycloak).
  - package-ecosystem: docker
    directories:
      - /devops/docker
      - /devops/keycloak
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kathmandu
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(images)"

  - package-ecosystem: terraform
    directories:
      - /devops/terraform/bootstrap
      - /devops/terraform/environments/production/edge
      - /devops/terraform/environments/production/starter
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kathmandu
    groups:
      providers:
        patterns: ["*"]
    commit-message:
      prefix: "chore(terraform)"
