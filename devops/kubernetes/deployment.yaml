# Templates only: images, probes, resources, and secret references need
# validation against implemented apps and the chosen Kubernetes provider.
# Production runs on ECS Fargate (ADR-009); Kubernetes needs an ADR first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxinov-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: oxinov-frontend }
  template:
    metadata:
      labels: { app: oxinov-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: registry.example.invalid/oxinov/frontend:replace-me
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: oxinov-config } }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxinov-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: oxinov-backend }
  template:
    metadata:
      labels: { app: oxinov-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: registry.example.invalid/oxinov/backend:replace-me
          ports: [{ containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: oxinov-config } }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: oxinov-runtime, key: database-url }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
          livenessProbe:
            httpGet: { path: /health/live, port: 4000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
      volumes:
        - { name: tmp, emptyDir: {} }
