groups:
  - name: oxinov-infrastructure
    rules:
      - alert: OxinovScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than two minutes."

      - alert: OxinovPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL monitoring is unavailable
          description: The PostgreSQL exporter has been unreachable for more than one minute.

      - alert: OxinovRedisExporterDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis monitoring is unavailable
          description: The Redis exporter has been unreachable for more than five minutes.

  - name: oxinov-application
    rules:
      - alert: OxinovApiHighErrorRate
        expr: |
          sum(rate(oxinov_http_requests_total{service="api",status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(oxinov_http_requests_total{service="api"}[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API server error rate exceeds 5%
          description: The API error ratio has exceeded 5% for ten minutes.

      - alert: OxinovApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(oxinov_http_request_duration_seconds_bucket{service="api"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds one second
          description: API p95 request duration has exceeded the proposed NFR target for ten minutes.

      - alert: OxinovPaymentFulfillmentFailure
        expr: increase(oxinov_payment_fulfillment_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A payment fulfillment failed
          description: At least one verified payment event failed to create its intended entitlement.

      - alert: OxinovExamSubmissionFailure
        expr: increase(oxinov_exam_submission_failures_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: An exam submission failed
          description: At least one exam submission failed during the last ten minutes.
